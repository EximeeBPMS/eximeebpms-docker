# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/" # Dockerfile with the alpine base image
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    # docker tags (e.g. "3.18") aren't reliably semver, so the semver-*-days
    # cooldown keys aren't supported for this ecosystem - default-days is the
    # only one that applies regardless of how the tag is classified.
    cooldown:
      default-days: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "actions/*"
      third-party-actions:
        patterns:
          - "*"
