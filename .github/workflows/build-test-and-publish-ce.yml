name: Build, test, and publish CE
on:
  workflow_dispatch:
    inputs:
      VERSION:
        description: 'Version to publish'
        required: true
      TAG_LATEST:
        description: 'Move the latest tags to this version; untick when republishing an older version'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: github-actions-runner-new
    strategy:
      fail-fast: false
      matrix:
        DISTRO: [run, tomcat]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      # test.sh drives docker-compose. The runner used to get the plugin from the dind
      # sidecar that github-actions-runner-new carried until BPMS-466 split the pool;
      # since then the CLI ships buildx only, so install compose explicitly.
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2
      - name: Expose GitHub Runtime
        uses: actions/github-script@v9
        with:
          script: |
            Object.keys(process.env).forEach(function (key) {
              if (key.startsWith('ACTIONS_')) {
                core.info(`${key}=${process.env[key]}`);
                core.exportVariable(key, process.env[key]);
              }
            });
      - name: Build
        run: ./pipeline.sh
        env:
          DISTRO: ${{ matrix.DISTRO }}
          SNAPSHOT: false
          PLATFORM: amd64
          VERSION: ${{ github.event.inputs.VERSION }}
      - name: Test
        run: ./test.sh
        working-directory: test
        env:
          DISTRO: ${{ matrix.DISTRO }}
          PLATFORM: amd64
          VERSION: ${{ github.event.inputs.VERSION }}
      - name: Clean up Docker resources
        if: always()
        run: docker system prune -af --volumes
  publish:
    runs-on: github-actions-runner-new
    needs: build-and-test
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        DISTRO: [run, tomcat]
    steps:
      - name: Determine user and set secret
        run: |
          echo "GITHUB_PAT_USER=SECRET_PAT_${{ github.actor }}" >> $GITHUB_ENV
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets[env.GITHUB_PAT_USER] }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: amd64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Expose GitHub Runtime
        uses: actions/github-script@v9
        with:
          script: |
            Object.keys(process.env).forEach(function (key) {
              if (key.startsWith('ACTIONS_') && !key.startsWith('ACTIONS_ID_TOKEN_')) {
                core.info(`${key}=${process.env[key]}`);
                core.exportVariable(key, process.env[key]);
              }
            });
      - name: Publish multi-platform images
        run: ./release.sh
        env:
          DISTRO: ${{ matrix.DISTRO }}
          SNAPSHOT: false
          PLATFORMS: linux/amd64
          GHCR_PASSWORD: ${{ secrets[env.GITHUB_PAT_USER] }}
          GHCR_USERNAME:  ${{ github.actor }}
          VERSION: ${{ github.event.inputs.VERSION }}
      # Same pin as eximeebpms-k8s's lint-test-release.yml; keyless signing with the job's OIDC token.
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
      - name: Sign the published image
        # release.sh has already logged in to ghcr.io; cosign reads the same Docker credentials.
        # All tags of the distro point at one digest, so signing the digest covers them all.
        # cosign reads ACTIONS_ID_TOKEN_REQUEST_* from the step environment itself; the "Expose GitHub
        # Runtime" step above deliberately does not export them.
        run: |
          set -euo pipefail
          image=ghcr.io/eximeebpms/eximeebpms-bpm-platform
          digest=$(docker buildx imagetools inspect "${image}:${{ matrix.DISTRO }}-${{ github.event.inputs.VERSION }}" --format '{{.Manifest.Digest}}')
          cosign sign --yes "${image}@${digest}"
          echo "Signed ${image}@${digest}" >> "$GITHUB_STEP_SUMMARY"
          TAG_LATEST: ${{ github.event.inputs.TAG_LATEST }}
      - name: Clean up Docker resources
        if: always()
        run: docker system prune -af --volumes
