name: Sign published CE images
# Signs images that were published before build-test-and-publish-ce.yml signed them (CE 1.4.0, 1.4.1).
# Signs what the tag points at now; it does not rebuild or move any tag. Runs from main only, so the
# certificate identity of every signature made here ends in @refs/heads/main.
on:
  workflow_dispatch:
    inputs:
      TAGS:
        description: 'Space-separated tags to sign, e.g. "run-1.4.1 tomcat-1.4.1 run-1.4.0 tomcat-1.4.0"'
        required: true

permissions: {}

jobs:
  sign:
    if: github.ref == 'refs/heads/main'
    runs-on: github-actions-runner-new
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Determine user and set secret
        run: |
          echo "GITHUB_PAT_USER=SECRET_PAT_${{ github.actor }}" >> $GITHUB_ENV
      - name: Check runner prerequisites
        # Reports everything that is missing in one run, instead of one failure per run.
        run: |
          missing=0
          for tool in curl sha256sum docker bash; do
            command -v "${tool}" >/dev/null || { echo "MISSING tool: ${tool}"; missing=1; }
          done
          docker buildx version >/dev/null 2>&1 || { echo "MISSING: docker buildx"; missing=1; }
          [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || { echo "MISSING: no OIDC token endpoint (id-token: write not effective)"; missing=1; }
          for url in https://github.com/sigstore/cosign/releases/download/v3.0.6/cosign_checksums.txt \
                     https://fulcio.sigstore.dev/api/v2/configuration \
                     https://rekor.sigstore.dev/api/v1/log \
                     https://tuf-repo-cdn.sigstore.dev/timestamp.json \
                     https://ghcr.io/v2/; do
            code=$(curl -s -o /dev/null -L --max-time 20 -w '%{http_code}' "${url}" || true)
            echo "${code} ${url}"
            case "${code}" in 2*|3*|401) ;; *) echo "UNREACHABLE: ${url}"; missing=1 ;; esac
          done
          exit "${missing}"
      # sigstore/cosign-installer needs envsubst, which the runner image does not have, so the
      # release binary is fetched and checked against the checksum published for it
      # (cosign_checksums.txt of the release).
      - name: Install cosign
        run: |
          set -euo pipefail
          version=v3.0.6
          sha256=c956e5dfcac53d52bcf058360d579472f0c1d2d9b69f55209e256fe7783f4c74
          dir="${RUNNER_TEMP}/cosign"
          mkdir -p "${dir}"
          curl -fsSL --retry 3 -o "${dir}/cosign" "https://github.com/sigstore/cosign/releases/download/${version}/cosign-linux-amd64"
          echo "${sha256}  ${dir}/cosign" | sha256sum -c -
          chmod +x "${dir}/cosign"
          echo "${dir}" >> "$GITHUB_PATH"
      - name: Sign the images
        # The images were pushed with the actor's PAT (release.sh), so the signature is pushed with it too:
        # GITHUB_TOKEN can write to the package only if the repository has Actions access to it.
        env:
          GHCR_PASSWORD: ${{ secrets[env.GITHUB_PAT_USER] }}
          GHCR_USERNAME: ${{ github.actor }}
          TAGS: ${{ github.event.inputs.TAGS }}
        run: |
          set -euo pipefail
          image=ghcr.io/eximeebpms/eximeebpms-bpm-platform
          echo "${GHCR_PASSWORD}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
          set -f
          for tag in $TAGS; do
            [[ "$tag" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Invalid tag: $tag" >&2; exit 1; }
            digest=$(docker buildx imagetools inspect "${image}:${tag}" --format '{{.Manifest.Digest}}')
            cosign sign --yes "${image}@${digest}"
            echo "Signed ${image}:${tag} (${digest})" >> "$GITHUB_STEP_SUMMARY"
          done
